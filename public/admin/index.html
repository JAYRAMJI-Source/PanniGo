<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaaniGo Admin Dashboard</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" style="max-width:420px;margin:90px auto;padding:28px;background:#fff;border:1px solid #dfe9f1;border-radius:14px"><h1>💧 PaaniGo Admin</h1><p>Secure admin login</p><input id="password" type="password" placeholder="Admin password" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #cadbe7;border-radius:8px"><button onclick="login()" class="export">Login</button><p id="loginMsg"></p></div>
<div id="app" style="display:none"><header><div class="brand">💧 Paani<span>Go</span> <small>Admin</small></div><div><span id="today"></span> <button onclick="logout()">Logout</button></div></header><main><div class="top"><div><p>CONTROL CENTER</p><h1>Order Dashboard</h1></div><button class="export" onclick="exportOrders()">Export Orders</button></div><section class="stats"><div><span>🆕</span><b id="newCount">0</b><small>New</small></div><div><span>🛵</span><b id="deliveryCount">0</b><small>Out for Delivery</small></div><div><span>✓</span><b id="doneCount">0</b><small>Delivered</small></div><div><span>₹</span><b id="sales">0</b><small>Sales</small></div></section><section class="panel"><div class="toolbar"><h2>Orders</h2><select id="filter" onchange="render()"><option>All</option><option>New</option><option>Confirmed</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select></div><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Address</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div></section><section class="panel zones"><div class="toolbar"><h2>Delivery Zones</h2><button onclick="addZone()">+ Add Zone</button></div><div id="zoneList"></div></section></main></div><script src="admin.js"></script></body></html>
